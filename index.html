<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner App - Image to PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .loading { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app"></div>

    <script>
        // Simple Scanner App - Client-Side Only
        const { jsPDF } = window.jspdf;

        class ScannerApp {
            constructor() {
                this.images = [];
                this.mode = 'home'; // home, receive, send, editor
                this.sessionId = null;
                this.peerConnection = null;
                this.render();
            }

            // Generate unique session ID
            generateSessionId() {
                return Math.random().toString(36).substring(2, 12);
            }

            // Render UI
            render() {
                const app = document.getElementById('app');
                
                if (this.mode === 'home') {
                    app.innerHTML = this.renderHome();
                } else if (this.mode === 'receive') {
                    app.innerHTML = this.renderReceive();
                    this.setupQRCode();
                } else if (this.mode === 'send') {
                    app.innerHTML = this.renderSend();
                } else if (this.mode === 'editor') {
                    app.innerHTML = this.renderEditor();
                }
                
                this.attachEventListeners();
            }

            renderHome() {
                return `
                    <div class="max-w-4xl mx-auto p-6">
                        <div class="text-center mb-12 mt-12">
                            <div class="text-6xl mb-4">📷</div>
                            <h1 class="text-4xl font-bold mb-2">Scanner App</h1>
                            <p class="text-gray-600">Scan documents, edit images, and create PDFs instantly</p>
                        </div>

                        <div class="grid md:grid-cols-2 gap-6">
                            <!-- Receive Mode -->
                            <div onclick="app.setMode('receive')" class="bg-white rounded-xl shadow-md p-6 hover:shadow-xl transition-shadow cursor-pointer">
                                <div class="flex items-start space-x-4">
                                    <div class="bg-blue-100 p-3 rounded-lg">
                                        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <h2 class="text-xl font-semibold mb-2">Receive from Phone</h2>
                                        <p class="text-gray-600 mb-4">Share a link and receive photos from your mobile device</p>
                                        <span class="text-blue-600 font-medium">Get started →</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Standalone Editor -->
                            <div onclick="app.setMode('editor')" class="bg-white rounded-xl shadow-md p-6 hover:shadow-xl transition-shadow cursor-pointer">
                                <div class="flex items-start space-x-4">
                                    <div class="bg-green-100 p-3 rounded-lg">
                                        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <h2 class="text-xl font-semibold mb-2">Scan & Edit</h2>
                                        <p class="text-gray-600 mb-4">Upload or capture images directly and convert to PDF</p>
                                        <span class="text-green-600 font-medium">Get started →</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-12 text-center text-sm text-gray-500">
                            <p>✨ No installation required • 🔒 Private & secure • 📱 Works on any device</p>
                        </div>
                    </div>
                `;
            }

            renderReceive() {
                const shareUrl = `${window.location.origin}${window.location.pathname}?mode=send&session=${this.sessionId || this.generateSessionId()}`;
                
                return `
                    <div class="max-w-6xl mx-auto p-6">
                        <button onclick="app.setMode('home')" class="mb-6 text-gray-600 hover:text-gray-900 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                            </svg>
                            Back
                        </button>

                        <div class="grid lg:grid-cols-3 gap-6">
                            <!-- Share Section -->
                            <div class="lg:col-span-1">
                                <div class="bg-white rounded-xl shadow-md p-6 sticky top-6">
                                    <h2 class="text-xl font-semibold mb-4">Share with Phone</h2>
                                    
                                    <div id="qrcode" class="bg-white p-4 rounded-lg border-2 border-gray-200 mb-4 flex justify-center"></div>
                                    
                                    <div class="text-center mb-4">
                                        <p class="text-sm text-gray-600 mb-2">Or copy link:</p>
                                        <input type="text" value="${shareUrl}" readonly 
                                            class="w-full px-3 py-2 text-sm border rounded-lg bg-gray-50" 
                                            onclick="this.select()">
                                        <button onclick="app.copyLink('${shareUrl}')" 
                                            class="mt-2 w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                            Copy Link
                                        </button>
                                    </div>

                                    <div class="text-center text-sm text-gray-500">
                                        <p>Waiting for images...</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Images Section -->
                            <div class="lg:col-span-2">
                                <div class="bg-white rounded-xl shadow-md p-6">
                                    <div class="flex justify-between items-center mb-6">
                                        <h2 class="text-xl font-semibold">Received Images (<span id="imageCount">0</span>)</h2>
                                        <button onclick="app.generatePDF()" 
                                            class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed"
                                            ${this.images.length === 0 ? 'disabled' : ''}>
                                            📄 Generate PDF
                                        </button>
                                    </div>

                                    <div id="imageGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                                        ${this.images.length === 0 ? `
                                            <div class="col-span-full text-center py-12 text-gray-400">
                                                <div class="text-6xl mb-4">📷</div>
                                                <p>No images yet. Open the link on your phone to upload images.</p>
                                            </div>
                                        ` : this.renderImageGrid()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderSend() {
                return `
                    <div class="max-w-2xl mx-auto p-6">
                        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
                            <h1 class="text-2xl font-bold mb-2">Scanner App</h1>
                            <div class="flex items-center space-x-2">
                                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                                <span class="text-sm text-gray-600">Connected</span>
                            </div>
                        </div>

                        <!-- Upload Buttons -->
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <label class="bg-white rounded-xl shadow-md p-8 hover:shadow-xl transition-shadow cursor-pointer flex flex-col items-center">
                                <svg class="w-12 h-12 text-blue-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <span class="font-medium">Take Photo</span>
                                <input type="file" accept="image/*" capture="environment" multiple onchange="app.handleFiles(this.files)" class="hidden">
                            </label>

                            <label class="bg-white rounded-xl shadow-md p-8 hover:shadow-xl transition-shadow cursor-pointer flex flex-col items-center">
                                <svg class="w-12 h-12 text-green-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span class="font-medium">Choose Photo</span>
                                <input type="file" accept="image/*" multiple onchange="app.handleFiles(this.files)" class="hidden">
                            </label>
                        </div>

                        <!-- Preview -->
                        ${this.images.length > 0 ? `
                            <div class="bg-white rounded-xl shadow-md p-6">
                                <h2 class="font-semibold mb-4">Preview (${this.images.length})</h2>
                                <div class="grid grid-cols-2 gap-4 mb-4">
                                    ${this.renderImageGrid()}
                                </div>
                                <button onclick="app.sendToDesktop()" 
                                    class="w-full px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                    📤 Send to Desktop
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            renderEditor() {
                return `
                    <div class="max-w-6xl mx-auto p-6">
                        <div class="flex justify-between items-center mb-6">
                            <button onclick="app.setMode('home')" class="text-gray-600 hover:text-gray-900 flex items-center">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                                </svg>
                                Back
                            </button>
                            <button onclick="app.generatePDF()" 
                                class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400"
                                ${this.images.length === 0 ? 'disabled' : ''}>
                                📄 Generate PDF
                            </button>
                        </div>

                        ${this.images.length === 0 ? `
                            <div class="bg-white rounded-xl shadow-md p-12 text-center">
                                <h2 class="text-2xl font-bold mb-6">Add Images</h2>
                                <div class="grid md:grid-cols-2 gap-6 max-w-2xl mx-auto">
                                    <label class="border-2 border-dashed border-gray-300 rounded-xl p-12 hover:border-blue-400 transition cursor-pointer flex flex-col items-center">
                                        <svg class="w-16 h-16 text-blue-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                        </svg>
                                        <span class="font-medium text-lg">Choose Images</span>
                                        <span class="text-sm text-gray-500 mt-2">From your device</span>
                                        <input type="file" accept="image/*" multiple onchange="app.handleFiles(this.files)" class="hidden">
                                    </label>

                                    <label class="border-2 border-dashed border-gray-300 rounded-xl p-12 hover:border-green-400 transition cursor-pointer flex flex-col items-center">
                                        <svg class="w-16 h-16 text-green-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                        </svg>
                                        <span class="font-medium text-lg">Take Photo</span>
                                        <span class="text-sm text-gray-500 mt-2">Using camera</span>
                                        <input type="file" accept="image/*" capture="environment" multiple onchange="app.handleFiles(this.files)" class="hidden">
                                    </label>
                                </div>
                            </div>
                        ` : `
                            <div class="bg-white rounded-xl shadow-md p-6">
                                <div class="flex justify-between items-center mb-6">
                                    <h2 class="text-xl font-semibold">Images (${this.images.length})</h2>
                                    <label class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 cursor-pointer">
                                        Add More
                                        <input type="file" accept="image/*" multiple onchange="app.handleFiles(this.files)" class="hidden">
                                    </label>
                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    ${this.renderImageGrid()}
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            renderImageGrid() {
                return this.images.map((img, index) => `
                    <div class="relative group bg-white rounded-lg border-2 border-gray-200 overflow-hidden hover:border-blue-400 transition">
                        <div class="aspect-square bg-gray-100">
                            <img src="${img.data}" alt="Image ${index + 1}" class="w-full h-full object-cover">
                        </div>
                        <button onclick="app.deleteImage(${index})" 
                            class="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                        <div class="absolute top-2 left-2 bg-black bg-opacity-60 text-white text-xs px-2 py-1 rounded">
                            ${index + 1}
                        </div>
                    </div>
                `).join('');
            }

            setMode(mode) {
                this.mode = mode;
                if (mode === 'receive') {
                    this.sessionId = this.generateSessionId();
                    this.setupLocalStorage();
                } else if (mode === 'send') {
                    this.loadSharedImages();
                }
                this.render();
            }

            setupQRCode() {
                const qrDiv = document.getElementById('qrcode');
                if (qrDiv && !qrDiv.hasChildNodes()) {
                    const shareUrl = `${window.location.origin}${window.location.pathname}?mode=send&session=${this.sessionId}`;
                    new QRCode(qrDiv, {
                        text: shareUrl,
                        width: 256,
                        height: 256
                    });
                }
            }

            setupLocalStorage() {
                // Listen for storage changes (for simple same-browser demo)
                window.addEventListener('storage', (e) => {
                    if (e.key === `scanner_${this.sessionId}`) {
                        this.images = JSON.parse(e.newValue || '[]');
                        this.render();
                    }
                });

                // Poll for updates (for cross-device, we'd use a real backend)
                setInterval(() => {
                    const stored = localStorage.getItem(`scanner_${this.sessionId}`);
                    if (stored) {
                        const newImages = JSON.parse(stored);
                        if (newImages.length !== this.images.length) {
                            this.images = newImages;
                            this.render();
                        }
                    }
                }, 1000);
            }

            loadSharedImages() {
                const params = new URLSearchParams(window.location.search);
                this.sessionId = params.get('session');
                const stored = localStorage.getItem(`scanner_${this.sessionId}`);
                if (stored) {
                    this.images = JSON.parse(stored);
                }
            }

            handleFiles(files) {
                Array.from(files).forEach(file => {
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.images.push({
                                data: e.target.result,
                                name: file.name
                            });
                            this.render();
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            deleteImage(index) {
                if (confirm('Delete this image?')) {
                    this.images.splice(index, 1);
                    this.render();
                }
            }

            sendToDesktop() {
                if (this.sessionId) {
                    localStorage.setItem(`scanner_${this.sessionId}`, JSON.stringify(this.images));
                    alert('Images sent! Check your desktop.');
                }
            }

            copyLink(url) {
                navigator.clipboard.writeText(url).then(() => {
                    alert('Link copied! Share it with your phone.');
                });
            }

            async generatePDF() {
                if (this.images.length === 0) return;

                try {
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: 'a4'
                    });

                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    const margin = 10;

                    for (let i = 0; i < this.images.length; i++) {
                        if (i > 0) pdf.addPage();

                        const img = await this.loadImage(this.images[i].data);
                        const imgWidth = img.width;
                        const imgHeight = img.height;

                        let finalWidth = pageWidth - (margin * 2);
                        let finalHeight = (imgHeight / imgWidth) * finalWidth;

                        if (finalHeight > pageHeight - (margin * 2)) {
                            finalHeight = pageHeight - (margin * 2);
                            finalWidth = (imgWidth / imgHeight) * finalHeight;
                        }

                        const x = (pageWidth - finalWidth) / 2;
                        const y = (pageHeight - finalHeight) / 2;

                        pdf.addImage(this.images[i].data, 'JPEG', x, y, finalWidth, finalHeight);
                    }

                    pdf.save(`scan_${Date.now()}.pdf`);
                    alert('PDF downloaded successfully!');
                } catch (error) {
                    console.error('PDF generation error:', error);
                    alert('Failed to generate PDF. Please try again.');
                }
            }

            loadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = src;
                });
            }

            attachEventListeners() {
                // Events are attached via onclick in HTML
            }
        }

        // Initialize app
        const app = new ScannerApp();

        // Check URL params on load
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode');
            if (mode) {
                app.setMode(mode);
            }
        });
    </script>
</body>
</html>
